<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Emirates — Unoverse demo</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #0a0a12; }
      img.page { width: 100%; height: auto; display: block; }
    </style>
  </head>
  <body>
    <!--
      A PRETEND CUSTOMER PAGE. Everything above the script tag is Emirates's website, faked
      with a screenshot. On their real site this is their own HTML and none of it is ours.

      There is no framework here and no build step for this file, which is the point: it is
      the same nothing a customer's page gives us.
    -->
    <!-- No screenshot for this channel yet: the launcher floats over an empty page. -->

    <!--
      THE EMBED. One tag, exactly what a customer pastes, and the only thing that differs
      between these demo pages is `data-app`.

      It injects the chrome a page has no way to provide: the launcher button, the sliding
      drawer, and the iframe. The APP itself is never injected — it arrives from unoverse
      over MCP as the ui:// resource, SDK included.

      Not type="module": the bundle is an IIFE so a plain tag works anywhere, in <head> or
      <body>, in a React app or a static page. The stylesheet is injected by the script, so
      there is no second tag to forget.
    -->
    <script src="/unoverse-demo.js" data-app="emirates/emirates-chat-layout"></script>
  </body>
</html>
