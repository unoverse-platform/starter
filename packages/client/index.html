<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Unoverse Demo</title>
    <style>
      /* box-sizing only — do NOT reset margin/padding on `*` here: this <style> is
         UNLAYERED, so it would override Tailwind's `@layer utilities` (p-8, mb-8, py-3…)
         and strip all component spacing. Reset margin on body alone. */
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      html,
      body {
        width: 100%;
        min-height: 100%;
      }
    </style>
  </head>
  <body>
    <!--
      The HUB, and nothing else: a card per channel. It carries no widget and no fake page.

      Each card links to a static page (`/bpp.html`, `/sab.html`…) that holds a screenshot
      and one <script> tag. Those pages are the customer simulation; this one is ours.
    -->
    <div id="app"></div>
    <script type="module" src="/src/demo/main.jsx"></script>
  </body>
</html>
